name: Build 3DSX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm

    steps:
      - uses: actions/checkout@v4

      - name: Build with Make
        run: make all

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dl
          compression-level: 0
          path: build
